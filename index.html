<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic FizzBuzz List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>FizzBuzz List Generator</h2>
        
        <div class="controls">
            <input type="number" id="limitInput" value="30" min="1">
            <button id="generateBtn">Regenerate</button>
        </div>

        <ul id="fizzBuzzList"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
